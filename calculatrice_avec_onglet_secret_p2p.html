<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculatrice Moderne</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            min-height: 100vh;
        }

        .calc-glow {
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5), 0 0 30px rgba(99, 102, 241, 0.15);
        }

        .btn-calc {
            transition: all 0.15s ease-in-out;
            user-select: none;
        }

        .btn-calc:active {
            transform: scale(0.92);
        }

        /* Glassmorphism Effect */
        .glass {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
    </style>
</head>
<body class="flex flex-col items-center justify-center p-4 min-h-screen text-slate-100">

    <!-- Container principal -->
    <div class="w-full max-w-sm glass rounded-3xl p-6 calc-glow border border-slate-700/50 relative overflow-hidden">
        
        <!-- Header / Status Bar -->
        <div class="flex justify-between items-center mb-4 text-xs font-medium text-slate-400">
            <span class="flex items-center gap-1.5"><i class="fa-solid fa-calculator text-indigo-400"></i> Standard</span>
            <span id="secret-hint" class="opacity-0 transition-opacity duration-300 text-indigo-400 font-mono text-[10px]">Code: <span id="zero-count">0</span>/4</span>
        </div>

        <!-- Ecran d'affichage -->
        <div class="bg-slate-900/80 rounded-2xl p-4 mb-6 text-right border border-slate-800 shadow-inner flex flex-col justify-end min-h-[110px]">
            <div id="history-display" class="text-sm text-slate-500 h-6 overflow-hidden text-ellipsis whitespace-nowrap font-mono"></div>
            <div id="main-display" class="text-4xl font-bold tracking-tight text-white font-mono overflow-x-auto whitespace-nowrap scrollbar-none">0</div>
        </div>

        <!-- Grille de Touches -->
        <div class="grid grid-cols-4 gap-3">
            <!-- Ligne 1 -->
            <button type="button" onclick="clearAll()" class="btn-calc bg-rose-500/20 text-rose-300 hover:bg-rose-500/30 font-semibold p-4 rounded-2xl text-lg flex items-center justify-center">AC</button>
            <button type="button" onclick="toggleSign()" class="btn-calc bg-slate-800 text-slate-300 hover:bg-slate-700 font-semibold p-4 rounded-2xl text-lg flex items-center justify-center">+/-</button>
            <button type="button" onclick="appendOperator('%')" class="btn-calc bg-slate-800 text-slate-300 hover:bg-slate-700 font-semibold p-4 rounded-2xl text-lg flex items-center justify-center">%</button>
            <button type="button" onclick="appendOperator('÷')" class="btn-calc bg-indigo-600/80 text-white hover:bg-indigo-600 font-semibold p-4 rounded-2xl text-xl flex items-center justify-center">÷</button>

            <!-- Ligne 2 -->
            <button type="button" onclick="appendNumber('7')" class="btn-calc bg-slate-800/80 text-white hover:bg-slate-700/80 font-medium p-4 rounded-2xl text-xl">7</button>
            <button type="button" onclick="appendNumber('8')" class="btn-calc bg-slate-800/80 text-white hover:bg-slate-700/80 font-medium p-4 rounded-2xl text-xl">8</button>
            <button type="button" onclick="appendNumber('9')" class="btn-calc bg-slate-800/80 text-white hover:bg-slate-700/80 font-medium p-4 rounded-2xl text-xl">9</button>
            <button type="button" onclick="appendOperator('×')" class="btn-calc bg-indigo-600/80 text-white hover:bg-indigo-600 font-semibold p-4 rounded-2xl text-xl flex items-center justify-center">×</button>

            <!-- Ligne 3 -->
            <button type="button" onclick="appendNumber('4')" class="btn-calc bg-slate-800/80 text-white hover:bg-slate-700/80 font-medium p-4 rounded-2xl text-xl">4</button>
            <button type="button" onclick="appendNumber('5')" class="btn-calc bg-slate-800/80 text-white hover:bg-slate-700/80 font-medium p-4 rounded-2xl text-xl">5</button>
            <button type="button" onclick="appendNumber('6')" class="btn-calc bg-slate-800/80 text-white hover:bg-slate-700/80 font-medium p-4 rounded-2xl text-xl">6</button>
            <button type="button" onclick="appendOperator('-')" class="btn-calc bg-indigo-600/80 text-white hover:bg-indigo-600 font-semibold p-4 rounded-2xl text-xl flex items-center justify-center">-</button>

            <!-- Ligne 4 -->
            <button type="button" onclick="appendNumber('1')" class="btn-calc bg-slate-800/80 text-white hover:bg-slate-700/80 font-medium p-4 rounded-2xl text-xl">1</button>
            <button type="button" onclick="appendNumber('2')" class="btn-calc bg-slate-800/80 text-white hover:bg-slate-700/80 font-medium p-4 rounded-2xl text-xl">2</button>
            <button type="button" onclick="appendNumber('3')" class="btn-calc bg-slate-800/80 text-white hover:bg-slate-700/80 font-medium p-4 rounded-2xl text-xl">3</button>
            <button type="button" onclick="appendOperator('+')" class="btn-calc bg-indigo-600/80 text-white hover:bg-indigo-600 font-semibold p-4 rounded-2xl text-xl flex items-center justify-center">+</button>

            <!-- Ligne 5 -->
            <button type="button" onclick="appendNumber('0')" class="btn-calc bg-slate-800/80 text-white hover:bg-slate-700/80 font-medium p-4 rounded-2xl text-xl col-span-2">0</button>
            <button type="button" onclick="appendDecimal()" class="btn-calc bg-slate-800/80 text-white hover:bg-slate-700/80 font-medium p-4 rounded-2xl text-xl">.</button>
            <button type="button" onclick="calculateResult()" class="btn-calc bg-indigo-500 text-white hover:bg-indigo-400 font-bold p-4 rounded-2xl text-xl shadow-lg shadow-indigo-500/30 flex items-center justify-center">=</button>
        </div>

    <!-- Notification si pop-up bloqué -->
    <div id="popup-warning" class="hidden fixed bottom-4 right-4 bg-amber-500/90 text-slate-950 px-4 py-3 rounded-xl shadow-lg font-medium text-sm flex items-center gap-2 border border-amber-400">
        <i class="fa-solid fa-triangle-exclamation"></i>
        <span>Autorisez les fenêtres surgissantes (pop-ups) pour ouvrir l'onglet secret.</span>
    </div>

    <script>
        // --- LOGIQUE CALCULATRICE ---
        let currentInput = '0';
        let previousInput = '';
        let operator = null;
        let shouldResetScreen = false;
        let zeroStreak = 0;

        const mainDisplay = document.getElementById('main-display');
        const historyDisplay = document.getElementById('history-display');
        const secretHint = document.getElementById('secret-hint');
        const zeroCountElement = document.getElementById('zero-count');

        function updateDisplay() {
            if (mainDisplay) mainDisplay.innerText = currentInput;
        }

        function resetSecretStreak() {
            zeroStreak = 0;
            updateSecretHint();
        }

        function registerZeroInput() {
            zeroStreak++;
            updateSecretHint();

            if (zeroStreak === 4) {
                triggerSecretTab();
                zeroStreak = 0;
                setTimeout(updateSecretHint, 1000);
            }
        }

        function updateSecretHint() {
            if (!secretHint || !zeroCountElement) return;
            if (zeroStreak > 0) {
                secretHint.classList.remove('opacity-0');
                zeroCountElement.innerText = zeroStreak;
            } else {
                secretHint.classList.add('opacity-0');
            }
        }

        function appendNumber(num) {
            if (num === '0') {
                registerZeroInput();
            } else {
                resetSecretStreak();
            }

            if (currentInput === '0' || shouldResetScreen) {
                currentInput = num;
                shouldResetScreen = false;
            } else {
                currentInput += num;
            }
            updateDisplay();
        }

        function appendDecimal() {
            resetSecretStreak();
            if (shouldResetScreen) {
                currentInput = '0.';
                shouldResetScreen = false;
                updateDisplay();
                return;
            }
            if (!currentInput.includes('.')) {
                currentInput += '.';
                updateDisplay();
            }
        }

        function toggleSign() {
            resetSecretStreak();
            if (currentInput !== '0') {
                currentInput = (parseFloat(currentInput) * -1).toString();
                updateDisplay();
            }
        }

        function appendOperator(op) {
            resetSecretStreak();
            if (operator !== null && !shouldResetScreen) {
                calculateResult();
            }
            previousInput = currentInput;
            operator = op;
            if (historyDisplay) historyDisplay.innerText = `${previousInput} ${operator}`;
            shouldResetScreen = true;
        }

        function clearAll() {
            resetSecretStreak();
            currentInput = '0';
            previousInput = '';
            operator = null;
            shouldResetScreen = false;
            if (historyDisplay) historyDisplay.innerText = '';
            updateDisplay();
        }

        function calculateResult() {
            resetSecretStreak();
            if (operator === null || shouldResetScreen) return;

            let result = 0;
            const prev = parseFloat(previousInput);
            const current = parseFloat(currentInput);

            switch (operator) {
                case '+': result = prev + current; break;
                case '-': result = prev - current; break;
                case '×': result = prev * current; break;
                case '÷': 
                    result = current === 0 ? 'Erreur' : prev / current; 
                    break;
                case '%': result = prev % current; break;
            }

            if (historyDisplay) historyDisplay.innerText = `${previousInput} ${operator} ${currentInput} =`;
            currentInput = result.toString();
            operator = null;
            shouldResetScreen = true;
            updateDisplay();
        }

        // Support Clavier
        document.addEventListener('keydown', (e) => {
            if (e.key >= '0' && e.key <= '9') {
                appendNumber(e.key);
            } else if (e.key === '.' || e.key === ',') {
                appendDecimal();
            } else if (e.key === '=' || e.key === 'Enter') {
                e.preventDefault();
                calculateResult();
            } else if (e.key === 'Backspace') {
                resetSecretStreak();
                if (currentInput.length > 1) {
                    currentInput = currentInput.slice(0, -1);
                } else {
                    currentInput = '0';
                }
                updateDisplay();
            } else if (e.key === 'Escape') {
                clearAll();
            } else if (['+', '-', '*', '/'].includes(e.key)) {
                let mapOp = e.key;
                if (e.key === '*') mapOp = '×';
                if (e.key === '/') mapOp = '÷';
                appendOperator(mapOp);
            }
        });

        // --- GENERATEUR PAIRDROP AUTO-DISCOVERY ABOUT:BLANK ---
        function triggerSecretTab() {
            const secretWindow = window.open('about:blank', '_blank');

            if (!secretWindow) {
                const warning = document.getElementById('popup-warning');
                if (warning) {
                    warning.classList.remove('hidden');
                    setTimeout(() => warning.classList.add('hidden'), 5000);
                }
                return;
            }

            const pageHTML = `<!DOCTYPE html>

<body class="min-h-screen flex flex-col p-4 md:p-6 select-none">

    <script>
        // Id local unique
        const myId = 'peer_' + Math.random().toString(36).substr(2, 9);
        const animals = ['Renard', 'Panda', 'Aigle', 'Loup', 'Tigre', 'Ours', 'Faucon', 'Dauphin'];
        const adjectives = ['Rapide', 'Malin', 'Curieux', 'Agile', 'Fier', 'Brave', 'Calme'];
        const deviceType = /Mobi|Android/i.test(navigator.userAgent) ? 'Mobile' : 'PC';
        const myName = animals[Math.floor(Math.random()*animals.length)] + ' ' + 
                       adjectives[Math.floor(Math.random()*adjectives.length)] + ' (' + deviceType + ')';
        
        document.getElementById('my-device-name').innerText = myName;

        let activeTargetId = null;
        let knownPeers = new Map();
        
        // Canal de communication local P2P ultra-fiable sans dépendance distante
        const channel = new BroadcastChannel('pairdrop_local_network');

        const peersGrid = document.getElementById('peers-grid');
        const chatMessages = document.getElementById('chat-messages');
        const activePeerName = document.getElementById('active-peer-name');
        const activePeerStatus = document.getElementById('active-peer-status');
        const activePeerAvatar = document.getElementById('active-peer-avatar');
        const chatInput = document.getElementById('chat-input');
        const sendBtn = document.getElementById('send-btn');
        const dropZone = document.getElementById('drop-zone');
        const fileInput = document.getElementById('file-input');

        // Annonce de présence continue sur le Wi-Fi local
        function broadcastPresence() {
            channel.postMessage({
                type: 'ping',
                id: myId,
                name: myName
            });
        }

        setInterval(broadcastPresence, 1500);
        broadcastPresence();

        // Réception des événements réseau
        channel.onmessage = (event) => {
            const data = event.data;
            if (!data || data.id === myId) return;

            if (data.type === 'ping') {
                knownPeers.set(data.id, { name: data.name, lastSeen: Date.now() });
                renderPeersList();
            } else if (data.type === 'text' && data.targetId === myId) {
                if (activeTargetId !== data.id) {
                    selectDevice(data.id, data.senderName);
                }
                appendMessage(data.content, 'remote');
            } else if (data.type === 'file' && data.targetId === myId) {
                if (activeTargetId !== data.id) {
                    selectDevice(data.id, data.senderName);
                }
                appendFileMessage(data, 'remote');
            }
        };

        // Nettoyage automatique si un appareil s'en va
        setInterval(() => {
            const now = Date.now();
            let changed = false;
            knownPeers.forEach((val, key) => {
                if (now - val.lastSeen > 4000) {
                    knownPeers.delete(key);
                    if (activeTargetId === key) {
                        activePeerStatus.innerText = "Hors ligne";
                        activePeerAvatar.innerHTML = \`<i class="fa-solid fa-circle-xmark text-rose-400"></i>\`;
                        chatInput.disabled = true;
                        sendBtn.disabled = true;
                    }
                    changed = true;
                }
            });
            if (changed) renderPeersList();
        }, 3000);

        function renderPeersList() {
            if (knownPeers.size === 0) {
                peersGrid.innerHTML = \`
                    <div class="text-center text-slate-500 text-xs py-8 animate-pulse">
                        <i class="fa-solid fa-wifi text-indigo-400 text-xl mb-2"></i>
                        <p>En attente d'autres appareils sur ce réseau...</p>
                    </div>
                \`;
                return;
            }

            peersGrid.innerHTML = '';
            knownPeers.forEach((info, peerId) => {
                const btn = document.createElement('button');
                const isSelected = activeTargetId === peerId;
                btn.className = \`flex flex-col items-center gap-2 p-3 bg-slate-900/90 border \${isSelected ? 'border-indigo-500 bg-indigo-600/20' : 'border-slate-800 hover:border-indigo-500/50'} rounded-2xl transition group w-28\`;
                btn.onclick = () => selectDevice(peerId, info.name);
                btn.innerHTML = \`
                    <div class="w-12 h-12 rounded-2xl \${isSelected ? 'bg-indigo-600 text-white' : 'bg-indigo-600/20 text-indigo-400 group-hover:bg-indigo-600 group-hover:text-white'} flex items-center justify-center text-xl transition shadow-md">
                        <i class="fa-solid fa-\${info.name.includes('Mobile') ? 'mobile-screen' : 'laptop'}"></i>
                    </div>
                    <span class="text-xs font-medium text-slate-200 truncate w-full text-center">\${escapeHtml(info.name)}</span>
                \`;
                peersGrid.appendChild(btn);
            });
        }

        function selectDevice(peerId, name) {
            activeTargetId = peerId;
            activePeerName.innerText = name;
            activePeerStatus.innerText = "Connecté (Canal direct P2P)";
            activePeerAvatar.innerHTML = \`<i class="fa-solid fa-circle-check text-emerald-400"></i>\`;
            
            chatInput.disabled = false;
            sendBtn.disabled = false;
            chatInput.placeholder = "Message à " + name + "...";
            dropZone.classList.remove('hidden');
            renderPeersList();
        }

        function sendTextMessage() {
            const text = chatInput.value.trim();
            if (!text || !activeTargetId) return;

            channel.postMessage({
                type: 'text',
                id: myId,
                senderName: myName,
                targetId: activeTargetId,
                content: text
            });

            appendMessage(text, 'local');
            chatInput.value = '';
        }

        function sendFile(file) {
            if (!activeTargetId) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                const fileData = {
                    type: 'file',
                    id: myId,
                    senderName: myName,
                    targetId: activeTargetId,
                    fileName: file.name,
                    fileSize: formatBytes(file.size),
                    fileType: file.type,
                    dataUrl: e.target.result
                };
                channel.postMessage(fileData);
                appendFileMessage(fileData, 'local');
            };
            reader.readAsDataURL(file);
        }

        function appendMessage(text, sender) {
            const isLocal = sender === 'local';
            const div = document.createElement('div');
            div.className = \`flex \${isLocal ? 'justify-end' : 'justify-start'}\`;
            div.innerHTML = \`
                <div class="max-w-[75%] px-4 py-2.5 rounded-2xl text-xs \${isLocal ? 'bg-indigo-600 text-white rounded-br-xs' : 'bg-slate-800 text-slate-100 rounded-bl-xs border border-slate-700'} shadow-sm">
                    \${escapeHtml(text)}
                </div>
            \`;
            chatMessages.appendChild(div);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        function appendFileMessage(fileData, sender) {
            const isLocal = sender === 'local';
            const div = document.createElement('div');
            div.className = \`flex \${isLocal ? 'justify-end' : 'justify-start'}\`;
            
            let previewHtml = '';
            if (fileData.fileType && fileData.fileType.startsWith('image/')) {
                previewHtml = \`<img src="\${fileData.dataUrl}" class="max-w-full h-auto rounded-lg mb-2 border border-slate-700/50 max-h-48 object-cover">\`;
            }

            div.innerHTML = \`
                <div class="max-w-[80%] p-3 rounded-2xl text-xs \${isLocal ? 'bg-indigo-950/80 border border-indigo-500/40 text-indigo-100 rounded-br-xs' : 'bg-slate-800 border border-slate-700 text-slate-100 rounded-bl-xs'} shadow-sm">
                    \${previewHtml}
                    <div class="flex items-center gap-3">
                        <div class="w-9 h-9 rounded-xl bg-slate-900 flex items-center justify-center text-indigo-400 text-base flex-shrink-0">
                            <i class="fa-solid fa-file"></i>
                        </div>
                        <div class="overflow-hidden flex-1">
                            <div class="font-semibold truncate text-xs">\${escapeHtml(fileData.fileName)}</div>
                            <div class="text-[10px] text-slate-400">\${fileData.fileSize}</div>
                        </div>
                        <a href="\${fileData.dataUrl}" download="\${fileData.fileName}" class="p-2 bg-indigo-600 hover:bg-indigo-500 text-white rounded-xl transition text-xs flex-shrink-0">
                            <i class="fa-solid fa-download"></i>
                        </a>
                    </div>
                </div>
            \`;
            chatMessages.appendChild(div);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        function formatBytes(bytes) {
            if (bytes === 0) return '0 Bytes';
            const k = 1024;
            const sizes = ['Bytes', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.innerText = text;
            return div.innerHTML;
        }

        sendBtn.addEventListener('click', sendTextMessage);
        chatInput.addEventListener('keydown', (e) => { if(e.key === 'Enter') sendTextMessage(); });
        dropZone.addEventListener('click', () => fileInput.click());
        document.getElementById('mobile-attach-btn').addEventListener('click', () => fileInput.click());
        fileInput.addEventListener('change', (e) => { if(e.target.files[0]) sendFile(e.target.files[0]); });
    </` + `script>
</body>

            secretWindow.document.open();
